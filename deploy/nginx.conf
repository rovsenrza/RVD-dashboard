# The cabinet behind nginx (Д31): the built web app, /api passed to the API container. TLS ends
# at the host's proxy or here — see docs/OPERATIONS.md once the server and domain are known (q. 8).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  # A file of up to 10 MB plus the form around it (Д25).
  client_max_body_size 11m;

  # No inline scripts anywhere (the theme is public/theme.js); styles allow inline for charts.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; media-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  # The scanner needs the camera of this site, nothing else does.
  add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;

  location /api/ {
    proxy_pass http://api:3001/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  # Hashed bundles never change under their name.
  location /assets/ {
    expires 1y;
  }

  # The page and its blocking theme script are asked for afresh, so a release shows at once.
  location = /index.html {
    expires -1;
  }
  location = /theme.js {
    expires -1;
  }

  # Every route of the single-page app ends at index.html.
  location / {
    try_files $uri /index.html;
  }
}
