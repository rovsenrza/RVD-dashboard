# The cabinet on one server (Д31): Postgres, the API, nginx with the web app, ClamAV.
#   cp .env.example .env   # fill 1С, JWT_SECRET, DB_PASSWORD, SMTP when known
#   docker compose -f deploy/docker-compose.prod.yml --env-file .env up -d --build
# Details, backups and the first administrator: docs/OPERATIONS.md.
name: rvd

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-rvd}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?задайте DB_PASSWORD в .env}
      POSTGRES_DB: ${DB_NAME:-rvd}
    volumes:
      - rvd-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-rvd}']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
    restart: unless-stopped
    env_file: ../.env
    environment:
      DATABASE_URL: postgres://${DB_USER:-rvd}:${DB_PASSWORD}@db:5432/${DB_NAME:-rvd}
      CORS_ORIGIN: ${CABINET_URL:-http://localhost}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      CLAMAV_HOST: clamav
    volumes:
      - rvd-files:/data/files
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    ports:
      - '${HTTP_PORT:-80}:80'
    depends_on:
      - api

  # Checks every upload (Д25). Needs about 1.5 GB of memory and loads its signatures on start;
  # without it, remove CLAMAV_HOST above — then only the EICAR test file is caught.
  clamav:
    image: clamav/clamav:1.4
    restart: unless-stopped
    volumes:
      - clamav-db:/var/lib/clamav

volumes:
  rvd-db:
  rvd-files:
  clamav-db:
