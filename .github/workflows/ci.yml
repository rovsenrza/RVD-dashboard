name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      # The API tests run against a real Postgres (products are filtered and sorted in SQL).
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: rvd
          POSTGRES_PASSWORD: rvd
          POSTGRES_DB: rvd
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rvd" --health-interval 5s --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Architecture guard
        run: npm run lint:arch

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
        env:
          TEST_DATABASE_URL: postgres://rvd:rvd@localhost:5432/rvd

      - name: Build
        run: npm run build
        env:
          VITE_USE_MOCKS: 'true'

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
