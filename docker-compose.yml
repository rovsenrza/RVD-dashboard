# Local Postgres for apps/api (the cache of 1С data). `docker compose up -d db`
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: rvd
      POSTGRES_PASSWORD: rvd
      POSTGRES_DB: rvd
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - rvd-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rvd']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  rvd-db:
